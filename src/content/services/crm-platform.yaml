pillar: automation
title: Lead follow-up system
summary: Every call, form and message gets a reply in minutes and a follow-up until it books. Quotes that went quiet get worked again, and you approve what goes out.
deliverables:
  - Instant replies to calls, forms, emails and DMs, with missed-call text-back or an after-hours AI receptionist
  - Follow-ups by text and email until they book, reply or say no
  - Old quotes and quiet leads followed up again
  - Online booking with reminders, so fewer no-shows
  - One pipeline showing every lead, where it came from and what's next
  - A monthly report on replies, bookings and what to fix next
idealFor: Businesses that already get leads but lose them to slow replies, voicemail or forgotten follow-ups.
exampleResult: "Missed-call text-back for a dental services company, so callers who can't get through still get a text."
startingAt: From $2,500 + $500/mo
discipline: crm
inquiryType: Lead follow-up system
order: 1
# Chinese text for the /zh pages
zh:
  title: 潜在客户跟进系统
  summary: 每一通来电、每一份表单、每一条消息都会在几分钟内得到回复，并持续跟进直到对方预约。沉寂的报价会被重新跟进，发出的内容都由你确认。
  deliverables:
    - 即时回复来电、表单、邮件和私信，配合未接来电自动回短信或下班后的 AI 接待员
    - 通过短信和邮件持续跟进，直到对方预约、回复或明确拒绝
    - 重新跟进旧报价和沉寂的潜在客户
    - 在线预约和提醒，减少爽约
    - 一个销售管道，看清每位潜在客户的来源和下一步
    - 每月报告：回复、预约，以及下一步该改进什么
  idealFor: 已经有潜在客户，却因回复慢、语音信箱或忘记跟进而流失客户的企业。
  exampleResult: 为一家牙科服务公司搭建未接来电自动回短信，让打不通电话的客户也能收到短信。
  startingAt: 起价 $2,500 + $500/月
